# ════════════════════════════════════════════════════════════
# VIKRAM PORTFOLIO + STORE — Render.com Deployment Config
# ════════════════════════════════════════════════════════════
# ✅ Auto-deploy on git push
# ✅ Persistent disk for database + uploads
# ✅ Free tier compatible
# ════════════════════════════════════════════════════════════

services:
  - type: web
    name: vikram-portfolio-store
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: vikram-data
      mountPath: /var/data
      sizeGB: 1