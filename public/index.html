<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>⚡ Bihari SMM Pro — Admin Control Center</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/><link href="css/app.css" rel="stylesheet"/><link href="css/login.css" rel="stylesheet"/><script src="config.js"></script></head><body><div class="bg-3d"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div><div class="bg-grid"></div><div aria-hidden="true" class="fx-particles" id="fxParticles"></div><div aria-hidden="true" class="cursor-glow" id="cursorGlow"></div><div aria-label="Administrator login" class="login-page" id="loginPage">
<div class="login-box">
<div class="login-brand"><div class="brand-mark"><i class="fas fa-bolt"></i></div></div>
<h1>Welcome back, Admin</h1>
<div class="subtitle">Bihari SMM Pro • Control Center</div>
<div class="welcome">Sign in to manage users, orders, services, payments &amp; bot health.</div>
<div class="error" id="loginError" role="alert"><i class="fas fa-circle-exclamation"></i> Invalid password</div>
<div class="input-group"><i class="fas fa-key"></i><input autocomplete="current-password" autofocus="" id="adminPassword" placeholder="Admin password" type="password"/><button aria-label="Show password" class="password-toggle" onclick="togglePasswordVisibility()" type="button"><i class="fas fa-eye"></i></button></div>
<button class="login-btn" id="loginButton" onclick="login()"><i class="fas fa-right-to-bracket"></i> Sign in to dashboard</button>
<div class="security-badge"><span><i class="fas fa-shield-halved"></i> Admin access</span><span><i class="fas fa-bolt"></i> Fast mode</span><span><i class="fas fa-circle-check"></i> API ready</span></div>
<div class="login-meta"><span><i class="fas fa-server"></i> Bot control center</span><span id="loginVersion">v20.1</span></div>
</div>
</div><script src="js/login.js?v=20.1"></script></body></html>
