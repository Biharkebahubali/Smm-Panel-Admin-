<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Bihari SMM Admin Panel — Secure Login">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>🔐 Login — Bihari SMM Admin Panel</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <!-- ============================================================
         LOADER OVERLAY
         ============================================================ -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner"></div>
    </div>

    <!-- ============================================================
         LOGIN CARD
         ============================================================ -->
    <div class="login-card" id="loginCard">

        <!-- ====================================================
             LOGO HEADER
             ==================================================== -->
        <div class="login-logo">
            <span class="login-logo-icon" id="logoIcon">🤖</span>
            <h1 id="brandName">Bihari SMM</h1>
            <p>Admin Panel • <span id="brandVersion">v7.0</span></p>
        </div>

        <!-- ====================================================
             ALERT BOX (error / success / info / warning)
             ==================================================== -->
        <div class="login-alert" id="alertBox"></div>

        <!-- ====================================================
             STEP 1 — PASSWORD
             ==================================================== -->
        <div class="login-step active" id="step1">

            <h2 class="login-step-title">🔑 Welcome Back</h2>
            <p class="login-step-subtitle">Pehle apna admin password enter karein</p>

            <form id="passwordForm" autocomplete="off" novalidate>
                <div class="form-group" id="passwordGroup">
                    <label class="form-label required" for="passwordInput">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" class="form-control"
                               placeholder="Enter admin password" autocomplete="current-password"
                               maxlength="128" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password">👁️</button>
                    </div>
                    <div class="form-error" id="passwordError">Password galat hai</div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="sendOtpBtn">
                    <span>📨</span>
                    <span>Continue &amp; Send OTP</span>
                </button>
            </form>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="rememberDevice" checked>
                <label for="rememberDevice">Remember this device (30 days)</label>
            </div>

        </div>

        <!-- ====================================================
             STEP 2 — OTP VERIFY
             ==================================================== -->
        <div class="login-step" id="step2">

            <h2 class="login-step-title">🔐 Enter OTP</h2>
            <p class="login-step-subtitle">
                Aapke Telegram (<strong id="otpTargetPreview">admin</strong>) par 6-digit OTP bheja gaya hai
            </p>

            <form id="otpForm" autocomplete="off" novalidate>

                <div class="otp-inputs" id="otpInputs">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="0" autocomplete="one-time-code">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="1">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="2">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="3">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="4">
                    <input type="text" class="otp-input" inputmode="numeric" maxlength="1" data-index="5">
                </div>

                <div class="otp-timer" id="otpTimer">
                    ⏱️ OTP expires in <strong id="otpTimerValue">05:00</strong>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg mt-md" id="verifyOtpBtn">
                    <span>✅</span>
                    <span>Verify OTP</span>
                </button>

                <div class="flex justify-between items-center mt-md" style="gap: 8px;">
                    <button type="button" class="btn btn-ghost btn-sm" id="backToStep1Btn">
                        ← Back
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" id="resendOtpBtn" disabled>
                        🔄 Resend OTP
                    </button>
                </div>

            </form>

        </div>

        <!-- ====================================================
             FOOTER
             ==================================================== -->
        <div class="login-footer">
            <p>
                🔒 Secure Connection •
                <a href="https://t.me/biharismmpannel_bot" target="_blank" rel="noopener noreferrer">
                    Telegram Bot
                </a>
            </p>
            <p style="margin-top: 4px; color: var(--text-disabled); font-size: 11px;">
                © <span id="yearSpan">2024</span> Bihari SMM •
                <a href="https://t.me/code_breaker" target="_blank" rel="noopener noreferrer">
                    @code_breaker
                </a>
            </p>
        </div>

    </div>

    <!-- ============================================================
         TOAST CONTAINER
         ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
